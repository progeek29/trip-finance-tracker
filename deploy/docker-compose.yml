# WanderSync production stack — Oracle Always-Free VM (single box)
# Services: api (Node + Socket.io) + postgres + caddy (auto-HTTPS)
# Usage: copy .env.example to .env, fill DOMAIN + POSTGRES_PASSWORD, then:
#   docker compose up -d --build
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wandersync
      POSTGRES_USER: wandersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First boot only: creates all tables (later boots skip it automatically)
      - ../supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - internal

  api:
    build: ../server
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://wandersync:${POSTGRES_PASSWORD}@postgres:5432/wandersync
    volumes:
      # Host secrets dir → /secrets inside container (read-only).
      # Firebase key file itself NEVER in git; container path comes from
      # FIREBASE_SERVICE_ACCOUNT_FILE=/secrets/firebase-service-account.json
      - /home/opc/secrets:/secrets:ro
    depends_on:
      - postgres
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - api
    networks:
      - web

volumes:
  pgdata:
  caddydata:
  caddyconfig:

networks:
  internal:
  web:
